<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Calculator</title><link rel="stylesheet" href="style.css"><script src="calculator.js" defer></script></head>
<body><div class="page-layout"><div class="calculator-wrap"><main><header><span>CALCULATOR</span><button id="theme" aria-label="Switch to light theme">☀</button></header><section class="display" aria-live="polite" aria-atomic="true"><p id="expression">&nbsp;</p><output id="result">0</output></section><div class="keys" aria-label="Calculator keypad">
<button data-key="AC" class="utility">AC</button><button data-key="sign" class="utility" aria-label="Change sign">±</button><button data-key="%" class="utility" aria-label="Percent">%</button><button data-key="Backspace" class="utility" aria-label="Delete last digit">⌫</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="/" class="operator" aria-label="Divide">÷</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="*" class="operator" aria-label="Multiply">×</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="-" class="operator" aria-label="Subtract">−</button>
<button data-key="0">0</button><button data-key=".">.</button><button data-key="=" class="equals" aria-label="Equals">=</button><button data-key="+" class="operator" aria-label="Add">+</button>
</div><footer>Simple Calculator <span>v1.1</span></footer></main><p class="hint">Keyboard supported · Enter = · Esc clears</p></div><aside class="student-card" aria-label="Student details"><img src="ousl-logo.png" alt="The Open University of Sri Lanka logo"><p class="university">The Open University of Sri Lanka</p><h1>Learning Manual Testing</h1><dl><div><dt>Student Name</dt><dd>B.H Chathura Sandeepa</dd></div><div><dt>Student ID</dt><dd>s25008563</dd></div><div><dt>Registration Number</dt><dd>426780872</dd></div><div><dt>Course</dt><dd>COU3303 Software Engineering</dd></div></dl></aside></div></body></html>
